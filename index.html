<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>PDF Ticket Cutter JPG</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      line-height: 1.5;
    }

    h1 {
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input, select, button {
      margin-top: 8px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .note {
      background: #f4f4f4;
      padding: 12px;
      margin-top: 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h1>PDF Ticket Cutter JPG</h1>

  <p>
    Wgraj PDF z biletami, wybierz układ i pobierz ZIP z osobnymi plikami JPG.
  </p>

  <div class="note">
    Pliki PDF są przetwarzane lokalnie w przeglądarce. Program nie zapisuje ich na GitHubie.
  </div>

  <label>Plik PDF:</label>
  <input type="file" id="pdfFile" accept="application/pdf" />

  <label>Układ biletów:</label>
  <select id="mode">
    <option value="pkl_palenica">3 bilety na stronie — PKL Palenica</option>
    <option value="pkl_gubalowka_no_price">3 bilety na stronie — PKL Gubałówka bez ceny</option>
    <option value="one">1 bilet na stronie</option>
  </select>

  <button onclick="processPdf()">Wytnij bilety JPG i pobierz ZIP</button>

  <div id="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    function isMostlyBlank(canvas) {
      const ctx = canvas.getContext('2d');
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      let darkPixels = 0;
      const totalPixels = canvas.width * canvas.height;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        if (r < 235 || g < 235 || b < 235) {
          darkPixels++;
        }
      }

      return darkPixels / totalPixels < 0.01;
    }

    async function processPdf() {
      const fileInput = document.getElementById('pdfFile');
      const mode = document.getElementById('mode').value;
      const status = document.getElementById('status');

      if (!fileInput.files.length) {
        alert('Najpierw wybierz plik PDF.');
        return;
      }

      status.textContent = 'Przetwarzanie PDF...';

      try {
        const file = fileInput.files[0];
        const pdfBytes = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
        const zip = new JSZip();

        let ticketNumber = 1;
        const renderScale = 3;

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          status.textContent = `Przetwarzanie strony ${pageNumber} z ${pdf.numPages}...`;

          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: renderScale });

          const pageCanvas = document.createElement('canvas');
          const pageCtx = pageCanvas.getContext('2d');

          pageCanvas.width = viewport.width;
          pageCanvas.height = viewport.height;

          await page.render({
            canvasContext: pageCtx,
            viewport: viewport
          }).promise;

          const pdfWidth = viewport.width / renderScale;
          const pdfHeight = viewport.height / renderScale;

          let crops = [];

          if (mode === 'one') {
            crops = [
              {
                x: 0,
                y: 0,
                w: pdfWidth,
                h: pdfHeight
              }
            ];
          }

          if (mode === 'pkl_palenica') {
            crops = [
              {
                x: 60,
                y: 608,
                w: 350,
                h: 204
              },
              {
                x: 60,
                y: 380,
                w: 350,
                h: 204
              },
              {
                x: 60,
                y: 152,
                w: 350,
                h: 204
              }
            ];
          }

          if (mode === 'pkl_gubalowka_no_price') {
            crops = [
              {
                x: 60,
                y: 607,
                w: 325,
                h: 200
              },
              {
                x: 60,
                y: 397,
                w: 325,
                h: 200
              },
              {
                x: 60,
                y: 187,
                w: 325,
                h: 200
              }
            ];
          }

          for (const crop of crops) {
            const sx = crop.x * renderScale;
            const sy = (pdfHeight - crop.y - crop.h) * renderScale;
            const sw = crop.w * renderScale;
            const sh = crop.h * renderScale;

            const ticketCanvas = document.createElement('canvas');
            const ticketCtx = ticketCanvas.getContext('2d');

            ticketCanvas.width = sw;
            ticketCanvas.height = sh;

            ticketCtx.fillStyle = 'white';
            ticketCtx.fillRect(0, 0, ticketCanvas.width, ticketCanvas.height);

            ticketCtx.drawImage(
              pageCanvas,
              sx,
              sy,
              sw,
              sh,
              0,
              0,
              sw,
              sh
            );

            if (isMostlyBlank(ticketCanvas)) {
              continue;
            }

            if (mode === 'pkl_gubalowka_no_price') {
              ticketCtx.fillStyle = 'white';

              // Zakrycie pola "CENA (z 8% VAT)" oraz "44,00 zł"
              ticketCtx.fillRect(
                118 * renderScale,
                112 * renderScale,
                95 * renderScale,
                36 * renderScale
              );
            }

            // Numer biletu — pod numerem zamówienia
            ticketCtx.font = 'bold 28px Arial';
            ticketCtx.fillStyle = 'red';
            ticketCtx.fillText(
              `BILET ${String(ticketNumber).padStart(3, '0')}`,
              145 * renderScale,
              145 * renderScale
            );

            const jpgBlob = await new Promise(resolve => {
              ticketCanvas.toBlob(resolve, 'image/jpeg', 0.95);
            });

            const fileName = `bilet_${String(ticketNumber).padStart(3, '0')}.jpg`;
            zip.file(fileName, jpgBlob);

            ticketNumber++;
          }
        }

        status.textContent = 'Tworzenie pliku ZIP...';

        const zipBlob = await zip.generateAsync({ type: 'blob' });

        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = 'bilety_jpg.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        status.textContent = `Gotowe. Wygenerowano ${ticketNumber - 1} biletów JPG.`;
      } catch (error) {
        console.error(error);
        status.textContent = 'Błąd: ' + error.message;
      }
    }
  </script>

</body>
</html>
